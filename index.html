<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>明日方舟香草杯</title>
<style>
:root{--bg:#1a1a2e;--bg2:#0f1629;--bg3:#0a1020;--card:#16213e;--card2:#1a2a4e;--card3:#111a33;--border:#2a4a7a;--border2:#2a3a5a;--border3:#444;--text:#eee;--text2:#aaa;--text3:#888;--text4:#555;--accent:#f0c040;--accent2:#ffd060;--accent-bg:rgba(240,192,64,.35);--hover:#1a3a5c;--hover2:#5a8aba;--win-bg:#1a2a4e;--champ-bg:#2a1a0e;--shadow:rgba(0,0,0,.4);--overlay:rgba(0,0,0,.6);--nm-shadow:#16213e;--picker-bg:rgba(15,22,41,.7);--line:#2a4a7a;--line-gold:#f0c040;--loading-bg:radial-gradient(ellipse at center,#1a2a4e 0%,#1a1a2e 70%);--red:#c44}
[data-theme="light"]{--bg:#f0f2f5;--bg2:#e4e8ed;--bg3:#dce0e6;--card:#ffffff;--card2:#f5f0e0;--card3:#eef1f5;--border:#c0c8d4;--border2:#b0b8c4;--border3:#999;--text:#222;--text2:#555;--text3:#888;--text4:#bbb;--accent:#d4a020;--accent2:#e8b830;--accent-bg:rgba(212,160,32,.25);--hover:#e0e6f0;--hover2:#6090c0;--win-bg:#f5f0e0;--champ-bg:#fef8e8;--shadow:rgba(0,0,0,.12);--overlay:rgba(0,0,0,.3);--nm-shadow:#ffffff;--picker-bg:rgba(255,255,255,.8);--line:#b0b8c4;--line-gold:#d4a020;--loading-bg:radial-gradient(ellipse at center,#e0e8f8 0%,#f0f2f5 70%);--red:#d44}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Microsoft YaHei","PingFang SC",sans-serif;overflow:hidden;display:flex;flex-direction:column;height:100vh;transition:background .3s,color .3s}
/* Loading */
#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;background:var(--loading-bg)}
#loading h1{color:var(--accent);font-size:32px;letter-spacing:2px}
#loading .sub{color:var(--text3);font-size:14px}
.prog-bar{width:min(400px,80vw);height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .3s}
#prog-text{font-size:13px;color:var(--text2)}
/* Main UI */
#main{display:none;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:stretch;background:var(--bg2);border-bottom:2px solid var(--border);z-index:200;flex-shrink:0;height:auto}
.tab-scroll{display:flex;align-items:center;gap:4px;padding:6px 10px;overflow-x:auto;overflow-y:hidden;flex:1;min-width:0;scrollbar-width:thin;scrollbar-color:var(--border) transparent;-webkit-overflow-scrolling:touch}
.tab-scroll::-webkit-scrollbar{height:3px}
.tab-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.toolbar{display:flex;align-items:center;gap:5px;padding:6px 10px;flex-shrink:0;border-left:1px solid var(--border);background:var(--bg3)}
.toolbar button{background:var(--card);color:var(--text);border:1px solid var(--border3);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:14px;white-space:nowrap;transition:all .15s}
.toolbar button:hover{background:var(--hover);transform:translateY(-1px)}
.tab-btn{background:var(--card);color:var(--text2);border:1px solid var(--border);border-bottom:none;border-radius:6px 6px 0 0;padding:6px 14px;cursor:pointer;font-size:14px;transition:all .2s;white-space:nowrap;flex-shrink:0}
.tab-btn:hover{color:var(--text);background:var(--hover)}
.tab-btn.active{background:var(--bg);color:var(--accent);font-weight:bold;border-color:var(--accent)}
.sep{width:1px;height:24px;background:var(--border);margin:0 2px;flex-shrink:0}
.panels{flex:1;position:relative;background:var(--bg)}
.panel{display:none;position:absolute;inset:0;overflow:hidden;cursor:grab}
.panel.act{display:block}
.panel.drag{cursor:grabbing}
.cv{transform-origin:0 0;position:absolute}
.S{position:absolute;width:88px;height:72px;background:var(--card);border:2px solid var(--border);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:border-color .2s,box-shadow .3s;overflow:hidden}
.S:hover{border-color:var(--hover2)}
.S.bye{opacity:.25;border-style:dashed}
.S.F{border-color:var(--hover2)}
.S.W{border-color:var(--accent);background:var(--win-bg);box-shadow:0 0 10px var(--accent-bg)}
.S.E{background:var(--bg2);border:2px dashed var(--border2);cursor:pointer}
.S.E:hover{border-color:var(--accent);background:var(--card3)}
.S.champ{border-color:var(--accent);background:var(--bg2)}
.S.champ.W{background:var(--champ-bg);box-shadow:0 0 20px rgba(240,192,64,.5)}
.S img{width:44px;height:44px;border-radius:4px;object-fit:cover;flex-shrink:0}
.S img.art{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:0;object-fit:cover;transform:scale(2.8);transform-origin:50% 18%;pointer-events:none}
.nm{font-size:9px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:82px;line-height:1.2;position:relative;z-index:1;text-shadow:0 0 3px var(--nm-shadow),0 0 6px var(--nm-shadow)}
.ph{color:var(--text4);font-size:18px}
.rl{position:absolute;color:var(--accent);font-size:12px;font-weight:bold;text-align:center;width:88px}
.cn{position:absolute;color:var(--line)}
.cn.gold{color:var(--line-gold)}
@keyframes winFlash{0%{box-shadow:0 0 0 rgba(240,192,64,0)}50%{box-shadow:0 0 24px rgba(240,192,64,.7)}100%{box-shadow:0 0 10px var(--accent-bg)}}
.S.flash{animation:winFlash .5s ease-out}
/* Overlays */
.overlay{display:none;position:fixed;inset:0;background:var(--overlay);z-index:500;justify-content:center;align-items:center;backdrop-filter:blur(2px)}
.overlay.show{display:flex}
.pbox{background:var(--card);border:2px solid var(--accent);border-radius:12px;padding:16px;display:flex;gap:20px;align-items:stretch;max-width:95vw}
.popt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;border:2px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s;min-width:110px}
.popt:hover{border-color:var(--accent);background:var(--card2);transform:translateY(-2px)}
.popt img{width:64px;height:64px;border-radius:6px;object-fit:cover;box-shadow:0 2px 8px var(--shadow)}
.popt .pn{font-size:13px;font-weight:bold;text-align:center;background:var(--picker-bg);padding:2px 8px;border-radius:4px}
.popt.dis{opacity:.3;cursor:not-allowed}
.pvs{display:flex;align-items:center;font-size:22px;font-weight:bold;color:var(--accent)}
.pcl{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;border:2px dashed var(--text4);border-radius:8px;cursor:pointer;color:var(--text3);font-size:12px;min-width:70px;transition:all .2s}
.pcl:hover{border-color:var(--red);color:var(--red)}
/* Bottom buttons */
.btns{position:fixed;bottom:12px;right:12px;z-index:300;display:flex;gap:6px}
.btns button{color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:13px;backdrop-filter:blur(8px);box-shadow:0 2px 8px var(--shadow);transition:transform .15s}
.btns button:hover{transform:translateY(-1px)}
/* Mobile */
@media(max-width:600px){
  .topbar{flex-wrap:wrap}
  .tab-scroll{padding:4px 6px;gap:3px;order:2;width:100%;border-top:1px solid var(--border2)}
  .toolbar{order:1;width:100%;border-left:none;justify-content:center;padding:4px 6px;gap:4px}
  .toolbar button{padding:5px 8px;font-size:12px}
  .tab-btn{padding:4px 8px;font-size:12px}
  .btns{bottom:8px;right:8px;gap:4px}
  .btns button{padding:6px 10px;font-size:11px}
  .pbox{padding:12px;gap:12px;flex-wrap:wrap}
  .popt{min-width:90px;padding:8px}
  .popt img{width:48px;height:48px}
  .settings-box{padding:16px;gap:12px;width:min(95vw,400px)}
  .srow{flex-wrap:wrap;gap:6px}
  .srow label{min-width:60px;font-size:12px}
  .srow select,.srow input[type=number]{font-size:12px;padding:6px}
  .share-box{padding:14px;width:min(95vw,600px)}
}
/* Share/Settings boxes */
.share-box{background:var(--card);border:2px solid var(--accent);border-radius:12px;padding:20px;width:min(90vw,700px);max-height:85vh;display:flex;flex-direction:column;gap:12px}
.share-tabs{display:flex;gap:6px}
.share-tab{background:var(--bg2);color:var(--text2);border:1px solid var(--border);border-radius:6px;padding:6px 16px;cursor:pointer;font-size:13px}
.share-tab.active{background:var(--bg);color:var(--accent);border-color:var(--accent)}
.share-panel{display:flex;flex-direction:column;gap:10px}
#ss-status{color:var(--text3);font-size:13px}
#ss-preview{max-height:400px;overflow:auto;border-radius:6px}
#ss-preview img{width:100%;border-radius:4px}
.share-actions{display:flex;gap:8px;flex-wrap:wrap}
.share-actions button{background:var(--border);color:var(--text);border:none;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px}
.share-actions button:hover{background:var(--hover2)}
#report-text{width:100%;height:360px;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:10px;font-size:12px;font-family:"Microsoft YaHei",monospace;resize:vertical}
.settings-box{background:var(--card);border:2px solid var(--accent);border-radius:12px;padding:24px;width:min(90vw,420px);display:flex;flex-direction:column;gap:16px}
.settings-box h2{color:var(--accent);font-size:18px;margin:0}
.srow{display:flex;align-items:center;gap:10px}
.srow label{font-size:13px;color:var(--text2);min-width:80px}
.srow select,.srow input[type=number]{background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:13px;flex:1}
.srow input[type=number]{width:70px;flex:none;text-align:center}
.sbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.sbtns button{background:var(--border);color:var(--text);border:none;border-radius:6px;padding:8px 20px;cursor:pointer;font-size:13px}
.sbtns button:hover{background:var(--hover2)}
.sbtns button.primary{background:#f0c040;color:#1a1a2e;font-weight:bold}
.sbtns button.primary:hover{background:#ffd060}
/* Character picker */
.charpick{background:var(--card);border:2px solid var(--accent);border-radius:12px;padding:16px;width:min(95vw,800px);max-height:85vh;display:flex;flex-direction:column;gap:10px}
.charpick h2{color:var(--accent);font-size:16px}
.cp-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cp-bar input{flex:1;min-width:120px;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:5px 10px;font-size:13px}
.cp-bar button{background:var(--border);color:var(--text);border:none;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12px}
.cp-bar span{font-size:12px;color:var(--text3)}
.cp-list{flex:1;overflow-y:auto;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;min-height:200px;max-height:55vh;padding:4px}
.cp-item{display:flex;align-items:center;gap:4px;padding:3px 6px;border:1px solid var(--border2);border-radius:4px;cursor:pointer;font-size:11px;transition:all .15s;background:var(--bg2)}
.cp-item:hover{border-color:var(--accent)}
.cp-item.sel{border-color:var(--accent);background:var(--win-bg)}
.cp-item img{width:28px;height:28px;border-radius:3px;object-fit:cover;flex-shrink:0}
.cp-item .ci-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80px}
/* Swap mode */
.S.swap-src{border-color:#4a90d9!important;box-shadow:0 0 12px rgba(74,144,217,.5)!important}
</style>
</head>
<body>

<div id="loading">
  <h1>明日方舟香草杯</h1>
  <div class="sub">全角色淘汰赛生成器</div>
  <div class="prog-bar"><div class="prog-fill" id="pf"></div></div>
  <div id="prog-text">准备中…</div>
</div>

<div id="main">
  <div class="topbar">
    <div class="tab-scroll" id="tabscroll"></div>
    <div class="toolbar" id="toolbar"></div>
  </div>
  <div class="panels" id="panels"></div>
  <div class="btns">
    <button style="background:#7a4a2a" onclick="showShare()">📤 分享</button>
    <button style="background:#2a4a7a" onclick="loadS()">📂 读取</button>
    <button style="background:#2a6a3a" onclick="saveS()">💾 保存</button>
  </div>
</div>

<div class="overlay" id="ov" onclick="if(event.target===this)cp()"><div class="pbox" id="pb"></div></div>

<div class="overlay" id="charpick-ov" onclick="if(event.target===this)closeCharPick()">
  <div class="charpick" id="charpick-box"></div>
</div>

<div class="overlay" id="settings-ov" onclick="if(event.target===this)closeSettings()">
  <div class="settings-box" id="settings-box"></div>
</div>

<div class="overlay" id="share-ov" onclick="if(event.target===this)closeShare()">
  <div class="share-box" id="share-box">
    <div class="share-tabs">
      <button class="share-tab active" onclick="showShareTab('screenshot')">📷 截图</button>
      <button class="share-tab" onclick="showShareTab('report')">📋 战报</button>
    </div>
    <div class="share-panel" id="sp-screenshot">
      <div id="ss-status">点击下方按钮截取当前赛区</div>
      <div id="ss-preview"></div>
      <div class="share-actions">
        <button onclick="captureScreenshot()">📷 截取当前赛区</button>
        <button onclick="captureFullBracket()">🖼️ 截取完整赛区</button>
        <button id="ss-dl" style="display:none" onclick="downloadScreenshot()">💾 下载图片</button>
        <button id="ss-cp" style="display:none" onclick="copyScreenshot()">📋 复制到剪贴板</button>
      </div>
    </div>
    <div class="share-panel" id="sp-report" style="display:none">
      <textarea id="report-text" readonly></textarea>
      <div class="share-actions">
        <button onclick="genReport()">🔄 生成战报</button>
        <button onclick="copyReport()">📋 复制</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ── Config ── */
const CW=88,CH=72,GAP=4,RGX=36,CHG=CH+GAP;
let DATA={male:[],female:[],other:[],all:[]};
let RAW_OPS=[];   // operators from PRTS
let RAW_ENEMIES=[]; // enemies from PRTS
let RAW_STORY=[];  // story characters from PRTS
let RAW_ITEMS=[];  // items from PRTS
let mode='gender'; // 'gender' | 'all'
let altMode='separate'; // 'separate' = 异格独立 | 'merge' = 异格合并
let excludeKeywords='卫戍协议,盟约,领主';
let dedupSameName=true;
let pools={operators:true,enemies:false,story:false,items:false};
let selectedOnly=null; // null=use all, Set=only these cn names
let swapMode=false,swapSlot=null; // which pools to include
let groupSizes={other:32,male:32,female:32,all:32};
let tabs=[],curTab=null,views={},pt=null;

/* ── PRTS Data Fetch ── */
const API='https://prts.wiki/api.php';

async function fetchWithRetry(url,retries=3){
  for(let i=0;i<retries;i++){
    try{const r=await fetch(url);if(r.ok)return r;throw new Error(`HTTP ${r.status}`)}
    catch(e){if(i===retries-1)throw e;await new Promise(r=>setTimeout(r,1000*(i+1)))}
  }
}

async function fetchOperators(){
  // Try cached data first
  setProg(0,'加载缓存数据…');
  let cached=null;
  try{
    const base=document.baseURI.replace(/[^/]*$/,'');
    const cr=await fetch(base+'operators.json');
    if(cr.ok)cached=await cr.json();
  }catch(e){}

  if(cached&&cached.length){
    setProg(10,`缓存 ${cached.length} 位干员，检查更新…`);
    // Check if PRTS has more operators
    let prtsCount=0;
    try{
      const countUrl=`${API}?action=cargoquery&tables=chara&fields=chara.cn&limit=1&format=json&origin=*`;
      // Use a lightweight query just to get total count
      const countUrl2=`${API}?action=cargoquery&tables=chara,chara_extra_info&join_on=chara._pageName=chara_extra_info._pageName&fields=chara.cn&limit=500&format=json&origin=*`;
      const cr2=await fetchWithRetry(countUrl2);
      const cd=await cr2.json();
      prtsCount=(cd.cargoquery||[]).length;
    }catch(e){
      setProg(20,`无法连接PRTS，使用缓存数据 (${cached.length}人)`);
      return cached.map(o=>({cn:o.cn,sex:o.sex,av:o.av,charId:o.cid||'',base:o.base||''}));
    }

    if(prtsCount<=cached.length){
      setProg(100,`数据已是最新 (${cached.length}人)`);
      return cached.map(o=>({cn:o.cn,sex:o.sex,av:o.av,charId:o.cid||'',base:o.base||''}));
    }
    setProg(15,`发现新干员 (${cached.length}→${prtsCount})，拉取完整数据…`);
  }

  // Full fetch from PRTS
  setProg(cached?15:0,'获取干员列表…');
  const url=`${API}?action=cargoquery&tables=chara,chara_extra_info`+
    `&join_on=chara._pageName=chara_extra_info._pageName`+
    `&fields=chara.cn,chara.charId,chara_extra_info.sex&limit=500&format=json&origin=*`;
  const r=await fetchWithRetry(url);
  const d=await r.json();
  const rows=d.cargoquery||[];
  const ops=rows.map(r=>{
    const cid=r.title.charId||'';
    const m=cid.match(/^char_\d+_(.+)/);
    const base=m?m[1].replace(/\d+$/,''):'';
    return{cn:r.title.cn,sex:r.title.sex||'',av:'',charId:cid,base};
  }).filter(o=>o.cn);

  // Reuse cached avatars where possible
  if(cached){
    const avMap={};
    for(const c of cached)if(c.av)avMap[c.cn]=c.av;
    const needFetch=[];
    for(const o of ops){
      if(avMap[o.cn])o.av=avMap[o.cn];
      else needFetch.push(o);
    }
    setProg(20,`复用 ${ops.length-needFetch.length} 个缓存头像，拉取 ${needFetch.length} 个新头像…`);
    if(needFetch.length)await fetchAvatars(needFetch);
  }else{
    setProg(20,`获取到 ${ops.length} 位干员，正在加载头像…`);
    await fetchAvatars(ops);
  }
  return ops;
}

async function fetchAvatars(ops){
  const BATCH=50;
  for(let i=0;i<ops.length;i+=BATCH){
    const batch=ops.slice(i,i+BATCH);
    const titles=batch.map(o=>`File:头像_${o.cn}.png`).join('|');
    const url=`${API}?action=query&titles=${encodeURIComponent(titles)}&prop=imageinfo&iiprop=url&format=json&origin=*`;
    const r=await fetchWithRetry(url);
    const d=await r.json();
    const pages=d.query?.pages||{};
    const map={};
    for(const p of Object.values(pages)){
      const t=p.title||'';
      const u=(p.imageinfo||[{}])[0]?.url||'';
      if(t.includes('头像')&&u){
        const name=t.replace(/^文件:头像 /,'').replace(/\.png$/,'');
        map[name]=u;
      }
    }
    for(const o of batch) o.av=map[o.cn]||'';
    const pct=20+Math.round((i+BATCH)/ops.length*80);
    setProg(Math.min(pct,99),`头像加载中… ${Math.min(i+BATCH,ops.length)}/${ops.length}`);
  }
}

function setProg(pct,text){
  document.getElementById('pf').style.width=pct+'%';
  document.getElementById('prog-text').textContent=text;
}

async function init(){
  try{
    const ops=await fetchOperators();
    RAW_OPS=ops;
    setProg(75,'加载敌人数据…');
    try{
      const base=document.baseURI.replace(/[^/]*$/,'');
      const er=await fetch(base+'enemies.json');
      if(er.ok)RAW_ENEMIES=(await er.json()).map(e=>({cn:e.cn,sex:'',av:e.av||'',charId:'',base:'',isEnemy:true}));
    }catch(e){}
    setProg(85,'加载剧情角色…');
    try{
      const base=document.baseURI.replace(/[^/]*$/,'');
      const sr=await fetch(base+'story_chars.json');
      if(sr.ok)RAW_STORY=(await sr.json()).map(e=>({cn:e.cn,sex:'',av:e.av||'',charId:'',base:'',isStory:true,isArt:true}));
    }catch(e){}
    setProg(90,'加载道具数据…');
    try{
      const base=document.baseURI.replace(/[^/]*$/,'');
      const ir=await fetch(base+'items.json');
      if(ir.ok)RAW_ITEMS=(await ir.json()).map(e=>({cn:e.cn,sex:'',av:e.av||'',charId:'',base:'',isItem:true,cat:e.cat||'未分类'}));
    }catch(e){}
    setProg(95,'加载覆写数据…');
    try{
      const base=document.baseURI.replace(/[^/]*$/,'');
      const owr=await fetch(base+'overwrites.json');
      if(owr.ok){
        const ow=await owr.json();
        const apply=arr=>{for(const o of arr){const v=ow[o.cn];if(v){for(const k in v){if(k!=='_说明')o[k]=v[k]}}}};
        apply(RAW_OPS);apply(RAW_ENEMIES);apply(RAW_STORY);
      }
    }catch(e){}
    rebuildData();
    const total=RAW_OPS.length+RAW_ENEMIES.length;
    setProg(100,`加载完成！干员${RAW_OPS.length} 敌人${RAW_ENEMIES.length} 剧情${RAW_STORY.length} 道具${RAW_ITEMS.length}`);
    setTimeout(()=>{
      document.getElementById('loading').style.display='none';
      const m=document.getElementById('main');m.style.display='flex';
      buildAll();
    },400);
  }catch(e){
    setProg(0,'加载失败: '+e.message+'。请刷新重试。');
  }
}

/* ── Data filtering ── */
function shuffleArr(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function rebuildData(){
  let ops=[];
  if(pools.operators)ops.push(...RAW_OPS);
  if(pools.enemies)ops.push(...RAW_ENEMIES);
  if(pools.story)ops.push(...RAW_STORY);
  if(pools.items)ops.push(...RAW_ITEMS);
  if(!ops.length)ops=[...RAW_OPS]; // fallback
  if(altMode==='merge'){
    // Sort: prefer versions with known gender, then lower charId (original)
    ops.sort((a,b)=>{
      if(a.base!==b.base)return 0;
      const ag=(a.sex==='男'||a.sex==='女')?0:1;
      const bg=(b.sex==='男'||b.sex==='女')?0:1;
      if(ag!==bg)return ag-bg;
      return(a.charId||'').localeCompare(b.charId||'');
    });
    const seen={};
    ops=ops.filter(o=>{
      if(!o.base)return true;
      if(seen[o.base])return false;
      seen[o.base]=true;
      return true;
    });
  }
  // Deduplicate exact same-name operators (keep the one with known gender)
  if(dedupSameName){
    const byName={};
    ops.forEach(o=>{
      if(!byName[o.cn])byName[o.cn]=o;
      else{
        const cur=byName[o.cn];
        const curG=(cur.sex==='男'||cur.sex==='女');
        const newG=(o.sex==='男'||o.sex==='女');
        if(!curG&&newG)byName[o.cn]=o;
      }
    });
    ops=Object.values(byName);
  }

  // Exclude by keywords
  if(excludeKeywords.trim()){
    const kws=excludeKeywords.split(',').map(k=>k.trim()).filter(Boolean);
    if(kws.length)ops=ops.filter(o=>!kws.some(k=>o.cn.includes(k)));
  }
  // Selected-only filter
  if(selectedOnly)ops=ops.filter(o=>selectedOnly.has(o.cn));
  DATA.male=ops.filter(o=>o.sex==='男');
  DATA.female=ops.filter(o=>o.sex==='女');
  DATA.other=ops.filter(o=>o.sex!=='男'&&o.sex!=='女');
  DATA.all=[...ops];
  // Build category groups (for items)
  DATA.cats={};
  for(const o of ops){
    const c=o.cat||'未分类';
    if(!DATA.cats[c])DATA.cats[c]=[];
    DATA.cats[c].push(o);
  }
}

/* ── Shuffle with byes scattered ── */
function shuffleWithByes(ops,totalSlots){
  // Shuffle operators
  const sh=[...ops];
  for(let i=sh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[sh[i],sh[j]]=[sh[j],sh[i]]}
  const nByes=totalSlots-sh.length;
  if(nByes<=0)return sh.slice(0,totalSlots);
  // Place byes at evenly spaced positions with jitter
  const step=totalSlots/nByes;
  const byeSet=new Set();
  for(let i=0;i<nByes;i++){
    let pos=Math.floor(step*i+Math.random()*step);
    pos=Math.max(0,Math.min(totalSlots-1,pos));
    while(byeSet.has(pos))pos=(pos+1)%totalSlots;
    byeSet.add(pos);
  }
  // Avoid adjacent byes in same match pair (2k,2k+1) — swap with nearest non-bye
  const byeArr=[...byeSet].sort((a,b)=>a-b);
  for(const p of byeArr){
    const pair=(p%2===0)?p+1:p-1;
    if(pair>=0&&pair<totalSlots&&byeSet.has(pair)){
      // Find nearest non-bye to swap with
      for(let d=1;d<totalSlots;d++){
        const c1=(pair+d)%totalSlots,c2=(pair-d+totalSlots)%totalSlots;
        for(const c of [c1,c2]){
          if(!byeSet.has(c)){
            const cPair=(c%2===0)?c+1:c-1;
            if(!byeSet.has(cPair)){byeSet.delete(pair);byeSet.add(c);break}
          }
        }
        if(!byeSet.has(pair))break;
      }
    }
  }
  const arr=new Array(totalSlots);
  let oi=0;
  for(let i=0;i<totalSlots;i++)arr[i]=byeSet.has(i)?null:sh[oi++];
  return arr;
}

/* ── Bracket Rendering ── */
function renderHalf(slots,gid,tag,xb,yb,mirror){
  const n=slots.length;if(n<1)return{html:'',winner:'',h:0,w:0};
  const rnds=Math.ceil(Math.log2(n))||1;
  const sz=1<<rnds;
  const s=[...slots];while(s.length<sz)s.push(null);
  let html='';
  for(let r=0;r<=rnds;r++){
    const sc=sz>>r,sp=CHG*(1<<r),off=(sp-CH)/2;
    const x=mirror?xb+(rnds-r)*(CW+RGX):xb+r*(CW+RGX);
    for(let i=0;i<sc;i++){
      const y=yb+off+i*sp,sid=`${gid}-${tag}-r${r}-s${i}`;
      if(r===0){
        const op=s[i];
        if(!op)html+=`<div class="S bye" id="${sid}" data-r="0" data-cn="" data-av="" style="left:${x}px;top:${y}px"><div class="nm">轮空</div></div>`;
        else{const ac=op.isArt?' art':'';html+=`<div class="S F" id="${sid}" data-r="0" data-cn="${op.cn}" data-av="${op.av}"${op.isArt?' data-art="1"':''} style="left:${x}px;top:${y}px" onclick="handleSlotClick(this)"><img class="${ac}" data-src="${op.av}" loading="lazy"><div class="nm">${op.cn}</div></div>`;}
      }else{
        const pa=`${gid}-${tag}-r${r-1}-s${i*2}`,pb=`${gid}-${tag}-r${r-1}-s${i*2+1}`;
        html+=`<div class="S E" id="${sid}" data-r="${r}" data-pa="${pa}" data-pb="${pb}" data-cn="" data-av="" style="left:${x}px;top:${y}px" onclick="openPicker(this)"><div class="ph">?</div></div>`;
      }
    }
    if(r<rnds){
      const ns=CHG*(1<<(r+1)),no=(ns-CH)/2;
      for(let i=0;i<sc;i+=2){
        const y1=yb+off+i*sp+CH/2,y2=yb+off+(i+1)*sp+CH/2,ny=yb+no+(i/2)*ns+CH/2;
        const sy=Math.min(y1,y2,ny)-2,sh=Math.max(y1,y2,ny)-sy+4;
        if(mirror){
          const mx=x-RGX;
          html+=`<svg class="cn" style="left:${mx}px;top:${sy}px;width:${RGX}px;height:${sh}px"><line x1="${RGX}" y1="${y1-sy}" x2="${RGX/2}" y2="${y1-sy}" stroke="currentColor" stroke-width="1.5"/><line x1="${RGX}" y1="${y2-sy}" x2="${RGX/2}" y2="${y2-sy}" stroke="currentColor" stroke-width="1.5"/><line x1="${RGX/2}" y1="${y1-sy}" x2="${RGX/2}" y2="${y2-sy}" stroke="currentColor" stroke-width="1.5"/><line x1="${RGX/2}" y1="${ny-sy}" x2="0" y2="${ny-sy}" stroke="currentColor" stroke-width="1.5"/></svg>`;
        }else{
          const mx=x+CW;
          html+=`<svg class="cn" style="left:${mx}px;top:${sy}px;width:${RGX}px;height:${sh}px"><line x1="0" y1="${y1-sy}" x2="${RGX/2}" y2="${y1-sy}" stroke="currentColor" stroke-width="1.5"/><line x1="0" y1="${y2-sy}" x2="${RGX/2}" y2="${y2-sy}" stroke="currentColor" stroke-width="1.5"/><line x1="${RGX/2}" y1="${y1-sy}" x2="${RGX/2}" y2="${y2-sy}" stroke="currentColor" stroke-width="1.5"/><line x1="${RGX/2}" y1="${ny-sy}" x2="${RGX}" y2="${ny-sy}" stroke="currentColor" stroke-width="1.5"/></svg>`;
        }
      }
    }
  }
  const winSp=CHG*(1<<rnds),winOff=(winSp-CH)/2;
  const winX=mirror?xb:xb+rnds*(CW+RGX);
  const winY=yb+winOff;
  return{html,winner:`${gid}-${tag}-r${rnds}-s0`,h:sz*CHG,w:(rnds+1)*(CW+RGX),wx:winX,wy:winY};
}

function renderBracket(ops,gid){
  const n=ops.length;if(n<2)return{html:'<div style="padding:40px;color:var(--text3)">人数不足</div>',w:400,h:200};
  const rnds=Math.ceil(Math.log2(n));
  const sz=1<<rnds,half=sz>>1;
  const all=shuffleWithByes(ops,sz);
  const topSlots=all.slice(0,half);
  const botSlots=all.slice(half);
  const T=renderHalf(topSlots,gid,'T',0,0,false);
  const halfW=T.w;
  const rightX=halfW+CW+RGX*2;
  const B=renderHalf(botSlots,gid,'B',rightX,0,true);
  const bh=Math.max(T.h,B.h);
  const champW=CW+20,champH=CH+16;
  // Champion centered between two winners
  const lx=T.wx+CW,rx=B.wx; // left winner right edge, right winner left edge
  const cx=(lx+rx)/2-champW/2;
  const cy=bh/2-champH/2;
  const fid=`${gid}-champ`;
  // Connector lines from winners to champion
  const lcy=T.wy+CH/2,rcy=B.wy+CH/2,ccy=cy+champH/2;
  let conns='';
  // Left winner → champion
  const lsx=lx,lex=cx,lsy=Math.min(lcy,ccy)-2,lsh=Math.abs(lcy-ccy)+4;
  conns+=`<svg class="cn gold" style="left:${lsx}px;top:${lsy}px;width:${lex-lsx}px;height:${lsh}px"><line x1="0" y1="${lcy-lsy}" x2="${lex-lsx}" y2="${ccy-lsy}" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4,3"/></svg>`;
  // Right winner → champion
  const rsx=cx+champW,rex=rx,rsy=Math.min(rcy,ccy)-2,rsh=Math.abs(rcy-ccy)+4;
  conns+=`<svg class="cn gold" style="left:${rsx}px;top:${rsy}px;width:${rex-rsx}px;height:${rsh}px"><line x1="0" y1="${ccy-rsy}" x2="${rex-rsx}" y2="${rcy-rsy}" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4,3"/></svg>`;
  const champ=`<div class="rl" style="left:${cx}px;top:${cy-24}px;width:${champW}px">冠军</div><div class="S E champ" id="${fid}" data-pa="${T.winner}" data-pb="${B.winner}" data-cn="" data-av="" style="left:${cx}px;top:${cy}px;width:${champW}px;height:${champH}px" onclick="openPicker(this)"><div class="ph" style="font-size:28px">👑</div></div>`;
  return{html:T.html+B.html+conns+champ,w:halfW*2+CW*3+RGX*4,h:bh+60};
}

function renderFinals(gids,fid){
  const n=gids.length,rnds=Math.ceil(Math.log2(n)),sz=1<<rnds;
  let html='';
  for(let r=0;r<=rnds;r++){
    const sc=sz>>r,sp=CHG*(1<<r),off=(sp-CH)/2;
    const x=r*(CW+RGX+20);
    const lbl=r===rnds?'总冠军':r===rnds-1?'决赛':`第${r+1}轮`;
    html+=`<div class="rl" style="left:${x}px;top:-30px">${lbl}</div>`;
    for(let i=0;i<sc;i++){
      const y=off+i*sp,sid=`${fid}-r${r}-s${i}`;
      if(r===0){
        if(i<gids.length){
          const lc=String.fromCharCode(65+i);
          html+=`<div class="S" id="${sid}" data-r="0" data-link="${gids[i]}-champ" data-src-tab="${gids[i]}" data-cn="" data-av="" style="left:${x}px;top:${y}px;border-color:var(--text3);background:var(--bg2)"><div class="ph" style="font-size:11px;color:var(--text3)">${lc}组冠军</div></div>`;
        }else{
          html+=`<div class="S bye" id="${sid}" data-r="0" data-cn="" data-av="" style="left:${x}px;top:${y}px"><div class="nm">轮空</div></div>`;
        }
      }else{
        const pa=`${fid}-r${r-1}-s${i*2}`,pb=`${fid}-r${r-1}-s${i*2+1}`;
        html+=`<div class="S E" id="${sid}" data-r="${r}" data-pa="${pa}" data-pb="${pb}" data-cn="" data-av="" style="left:${x}px;top:${y}px" onclick="openPicker(this)"><div class="ph">?</div></div>`;
      }
    }
    if(r<rnds){
      const ns=CHG*(1<<(r+1)),no=(ns-CH)/2;
      for(let i=0;i<sc;i+=2){
        const y1=off+i*sp+CH/2,y2=off+(i+1)*sp+CH/2,ny=no+(i/2)*ns+CH/2;
        const mx=x+CW,sy=Math.min(y1,y2,ny)-2,sh=Math.max(y1,y2,ny)-sy+4;
        html+=`<svg class="cn" style="left:${mx}px;top:${sy}px;width:${RGX+20}px;height:${sh}px"><line x1="0" y1="${y1-sy}" x2="${(RGX+20)/2}" y2="${y1-sy}" stroke="currentColor" stroke-width="1.5"/><line x1="0" y1="${y2-sy}" x2="${(RGX+20)/2}" y2="${y2-sy}" stroke="currentColor" stroke-width="1.5"/><line x1="${(RGX+20)/2}" y1="${y1-sy}" x2="${(RGX+20)/2}" y2="${y2-sy}" stroke="currentColor" stroke-width="1.5"/><line x1="${(RGX+20)/2}" y1="${ny-sy}" x2="${RGX+20}" y2="${ny-sy}" stroke="currentColor" stroke-width="1.5"/></svg>`;
      }
    }
  }
  return{html,w:(rnds+1)*(CW+RGX+20)+100,h:sz*CHG+60};
}

let splitMode='fill'; // 'fill' = 满编(每组填满上限) | 'even' = 均分(各组平均)

function splitPool(pool,maxSize){
  if(pool.length<=maxSize)return[pool];
  if(splitMode==='fill'){
    const out=[];
    for(let i=0;i<pool.length;i+=maxSize)out.push(pool.slice(i,i+maxSize));
    return out;
  }
  const ng=Math.ceil(pool.length/maxSize);
  const per=Math.ceil(pool.length/ng);
  const out=[];
  for(let i=0;i<pool.length;i+=per)out.push(pool.slice(i,i+per));
  return out;
}

/* ── Build All Tabs ── */
function buildAll(){
  const prevIdx=tabs.findIndex(t=>t.id===curTab);
  const bar=document.getElementById('tabscroll');
  const panels=document.getElementById('panels');
  bar.innerHTML='';panels.innerHTML='';
  tabs=[];views={};

  if(mode==='gender'){
    const cats=[
      {key:'other',label:'其他',icon:'⚧'},
      {key:'male',label:'男性',icon:'♂'},
      {key:'female',label:'女性',icon:'♀'}
    ];
    for(const cat of cats){
      const pool=shuffleArr(DATA[cat.key]);
      if(!pool.length)continue;
      const gs=groupSizes[cat.key];
      const groups=splitPool(pool,gs);
      if(groups.length===1){
        addBracketTab(cat.key,`${cat.icon} ${cat.label} (${pool.length})`,pool);
      }else{
        const gids=[];
        for(let i=0;i<groups.length;i++){
          const tid=`${cat.key}${i}`;
          const lc=String.fromCharCode(65+i);
          addBracketTab(tid,`${cat.icon} ${cat.label}${lc} (${groups[i].length})`,groups[i]);
          gids.push(tid);
        }
        addFinalsTab(`${cat.key}_final`,`${cat.icon} ${cat.label}决赛`,gids);
      }
      bar.innerHTML+='<div class="sep"></div>';
    }
  }else if(mode==='category'){
    const catNames=Object.keys(DATA.cats).sort((a,b)=>(DATA.cats[b]?.length||0)-(DATA.cats[a]?.length||0));
    for(const catName of catNames){
      const pool=shuffleArr(DATA.cats[catName]);
      if(!pool.length)continue;
      const safeName=catName.replace(/[^a-zA-Z0-9一-鿿]/g,'');
      const gs=groupSizes.all||32;
      const groups=splitPool(pool,gs);
      if(groups.length===1){
        addBracketTab(`cat_${safeName}`,`${catName} (${pool.length})`,pool);
      }else{
        const gids=[];
        for(let i=0;i<groups.length;i++){
          const tid=`cat_${safeName}_${i}`;
          addBracketTab(tid,`${catName}${String.fromCharCode(65+i)} (${groups[i].length})`,groups[i]);
          gids.push(tid);
        }
        addFinalsTab(`cat_${safeName}_f`,`${catName}决赛`,gids);
      }
      bar.innerHTML+='<div class="sep"></div>';
    }
  }else{
    const pool=shuffleArr(DATA.all);
    const gs=groupSizes.all;
    const groups=splitPool(pool,gs);
    if(groups.length===1){
      addBracketTab('all',`全员混战 (${pool.length})`,pool);
    }else{
      const gids=[];
      for(let i=0;i<groups.length;i++){
        const tid=`all${i}`;
        const lc=String.fromCharCode(65+i);
        addBracketTab(tid,`${lc}组 (${groups[i].length})`,groups[i]);
        gids.push(tid);
      }
      addFinalsTab('all_final','总决赛',gids);
    }
    bar.innerHTML+='<div class="sep"></div>';
  }

  // Toolbar (fixed right side)
  const tb=document.getElementById('toolbar');
  tb.innerHTML='<button onclick="openSettings()">⚙ 设置</button>'+
    '<button onclick="showShuffleMenu()" style="background:#6a3a2a;border-color:#6a3a2a;color:#eee">🎲 打乱</button>'+
    '<button onclick="zm(1.3)">＋</button><button onclick="zm(.7)">－</button>'+
    '<button onclick="rvTab(curTab)">重置</button>'+
    '<button onclick="toggleSwap()" id="swapBtn">🔄 交换</button>'+
    `<button onclick="toggleTheme()">${document.documentElement.dataset.theme==='light'?'🌙':'☀️'}</button>`;

  wireUpPanels();
  // Tab scroll: convert vertical wheel to horizontal scroll
  const ts=document.getElementById('tabscroll');
  if(ts)ts.addEventListener('wheel',e=>{e.preventDefault();ts.scrollLeft+=e.deltaY},{passive:false});
  const restoreIdx=Math.min(Math.max(0,prevIdx),tabs.length-1);
  if(tabs.length)switchTab(tabs[restoreIdx].id);
  setTimeout(()=>{autoAdv();syncFinals()},100);
}

function addBracketTab(tid,label,ops){
  const b=renderBracket(ops,tid);

  views[tid]={w:b.w,h:b.h,s:1,tx:50,ty:50,dr:false,lx:0,ly:0,loaded:false};

function addFinalsTab(tid,label,gids){
  const f=renderFinals(gids,tid);
  tabs.push({id:tid,isFinal:true});
  const bar=document.getElementById('tabscroll');
  const panels=document.getElementById('panels');
  bar.innerHTML+=`<div class="tab-btn" onclick="switchTab('${tid}')">${label}</div>`;
  panels.innerHTML+=`<div class="panel" id="p-${tid}"><div class="cv" id="cv-${tid}" style="width:${f.w}px;height:${f.h}px">${f.html}</div></div>`;
  views[tid]={w:f.w,h:f.h,s:1,tx:50,ty:50,dr:false,lx:0,ly:0,loaded:false};
}

function wireUpPanels(){
  tabs.forEach(t=>{
    const panel=document.getElementById('p-'+t.id);
    if(!panel)return;
    // Mouse
    panel.addEventListener('mousedown',e=>{
      const v=views[t.id];v.dr=true;v.lx=e.clientX;v.ly=e.clientY;panel.classList.add('drag')});
    panel.addEventListener('mousemove',e=>{
      const v=views[t.id];if(!v.dr)return;v.tx+=e.clientX-v.lx;v.ty+=e.clientY-v.ly;v.lx=e.clientX;v.ly=e.clientY;apV(t.id)});
    panel.addEventListener('mouseup',()=>{views[t.id].dr=false;panel.classList.remove('drag')});
    panel.addEventListener('mouseleave',()=>{views[t.id].dr=false;panel.classList.remove('drag')});
    panel.addEventListener('wheel',e=>{
      e.preventDefault();const f=e.deltaY<0?1.1:.9,v=views[t.id];
      v.tx=e.clientX-(e.clientX-v.tx)*f;v.ty=e.clientY-(e.clientY-v.ty)*f;v.s*=f;apV(t.id)},{passive:false});
    // Touch: drag + pinch zoom
    let lastDist=0;
    panel.addEventListener('touchstart',e=>{
      const v=views[t.id];
      if(e.touches.length===1){v.dr=true;v.lx=e.touches[0].clientX;v.ly=e.touches[0].clientY}
      if(e.touches.length===2){v.dr=false;lastDist=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY)}
    },{passive:true});
    panel.addEventListener('touchmove',e=>{
      e.preventDefault();const v=views[t.id];
      if(e.touches.length===1&&v.dr){
        const cx=e.touches[0].clientX,cy=e.touches[0].clientY;
        v.tx+=cx-v.lx;v.ty+=cy-v.ly;v.lx=cx;v.ly=cy;apV(t.id)}
      if(e.touches.length===2){
        const d=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);
        if(lastDist>0){
          const f=d/lastDist;
          const mx=(e.touches[0].clientX+e.touches[1].clientX)/2;
          const my=(e.touches[0].clientY+e.touches[1].clientY)/2;
          v.tx=mx-(mx-v.tx)*f;v.ty=my-(my-v.ty)*f;v.s*=f;apV(t.id)}
        lastDist=d}
    },{passive:false});
    panel.addEventListener('touchend',()=>{views[t.id].dr=false;lastDist=0});
  });
}

/* ── View Controls ── */
function apV(g){const v=views[g],cv=document.getElementById('cv-'+g);if(cv)cv.style.transform=`translate(${v.tx}px,${v.ty}px) scale(${v.s})`}
function rvTab(g){
  const v=views[g],p=document.getElementById('p-'+g);if(!v||!p)return;
  const pw=p.clientWidth||innerWidth,ph=p.clientHeight||(innerHeight-60);
  v.s=Math.min(pw/v.w,ph/v.h)*.85;
  v.tx=(pw-v.w*v.s)/2;
  v.ty=(ph-v.h*v.s)/2;
  apV(g)}
function zm(f){if(!curTab)return;const v=views[curTab],cx=innerWidth/2,cy=innerHeight/2;v.tx=cx-(cx-v.tx)*f;v.ty=cy-(cy-v.ty)*f;v.s*=f;apV(curTab)}
function loadImgs(g){
  if(views[g]?.loaded)return;
  document.querySelectorAll('#p-'+g+' img[data-src]').forEach(img=>{img.src=img.dataset.src;img.removeAttribute('data-src')});
  if(views[g])views[g].loaded=true}
function switchTab(g){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const btns=[...document.querySelectorAll('.tab-btn')];
  const idx=tabs.findIndex(t=>t.id===g);
  if(btns[idx])btns[idx].classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('act'));
  const p=document.getElementById('p-'+g);if(p)p.classList.add('act');
  curTab=g;if(views[g]?.s===1)rvTab(g);loadImgs(g);syncFinals()}

  bx.innerHTML=h;

function shuffleCurrent(){
  if(!curTab)return;
  const panel=document.getElementById('p-'+curTab);
  if(!panel)return;
  // Collect round-0 filled slots (operators) in this tab
  const r0=[...panel.querySelectorAll('.S[data-r="0"]')].filter(s=>!s.id.includes('-champ'));
  const ops=[];const byeCount=[0];
  r0.forEach(s=>{
    if(s.classList.contains('bye'))byeCount[0]++;
    else if(s.dataset.cn)ops.push({cn:s.dataset.cn,av:s.dataset.av,isArt:!!s.dataset.art});
  });
  // Shuffle ops + byes
  const total=r0.length;
  const shuffled=shuffleWithByes(ops,total);
  // Clear all non-r0 slots in this tab
  panel.querySelectorAll('.S').forEach(s=>{
    const r=parseInt(s.dataset.r);
    if(r>0&&!s.id.includes('-champ')){
      s.className='S E';s.dataset.cn='';s.dataset.av='';delete s.dataset.art;
      s.innerHTML='<div class="ph">?</div>';s.setAttribute('onclick','openPicker(this)');
    }
  });
  // Also reset champ
  const champ=panel.querySelector('.S.champ');
  if(champ&&(champ.classList.contains('F')||champ.classList.contains('W'))){
    champ.className='S E champ';champ.dataset.cn='';champ.dataset.av='';
    champ.innerHTML='<div class="ph" style="font-size:28px">👑</div>';
    champ.setAttribute('onclick','openPicker(this)');
  }
  // Reassign r0 slots
  r0.forEach((s,i)=>{
    const op=shuffled[i];
    if(!op){
      s.className='S bye';s.dataset.cn='';s.dataset.av='';delete s.dataset.art;
      s.innerHTML='<div class="nm">轮空</div>';s.removeAttribute('onclick');
    }else{
      const ac=op.isArt?' art':'';
      s.className='S F';s.dataset.cn=op.cn;s.dataset.av=op.av;
      if(op.isArt)s.dataset.art='1';else delete s.dataset.art;
      s.innerHTML=`<img class="${ac}" src="${op.av}" loading="lazy"><div class="nm">${op.cn}</div>`;
    }
  });
  autoAdv();syncFinals();
}

/* ── Auto Advance Byes ── */
function autoAdv(){
  let changed=true;
  while(changed){
    changed=false;
    document.querySelectorAll('.S.E').forEach(s=>{
      const pa=document.getElementById(s.dataset.pa),pb=document.getElementById(s.dataset.pb);
      if(!pa||!pb)return;
      const ab=pa.classList.contains('bye'),bb=pb.classList.contains('bye');
      const af=pa.classList.contains('F')||pa.classList.contains('W');
      const bf=pb.classList.contains('F')||pb.classList.contains('W');
      if(ab&&bf&&pb.dataset.cn){sel(s,pb);changed=true}
      else if(bb&&af&&pa.dataset.cn){sel(s,pa);changed=true}
      else if(ab&&bb){s.className='S bye';s.innerHTML='<div class="nm">轮空</div>';s.dataset.cn='';s.dataset.av='';s.removeAttribute('onclick');changed=true}
    });
  }
}
function sel(s,w){
  s.className='S F W flash';s.dataset.cn=w.dataset.cn;s.dataset.av=w.dataset.av;
  const ac=w.dataset.art?'art':'';
  if(w.dataset.art)s.dataset.art='1';else delete s.dataset.art;
  s.innerHTML=`<img class="${ac}" src="${w.dataset.av}" loading="lazy"><div class="nm">${w.dataset.cn}</div>`;
  s.setAttribute('onclick','openPicker(this)');
  setTimeout(()=>s.classList.remove('flash'),500);
  syncFinals()}

function syncFinals(){
  document.querySelectorAll('[data-link]').forEach(slot=>{
    const src=document.getElementById(slot.dataset.link);
    if(!src)return;
    const hasCn=src.dataset.cn&&(src.classList.contains('F')||src.classList.contains('W'));
    if(hasCn&&slot.dataset.cn!==src.dataset.cn){
      slot.className='S F W';
      slot.dataset.cn=src.dataset.cn;slot.dataset.av=src.dataset.av;
      slot.innerHTML=`<img src="${src.dataset.av}" loading="lazy"><div class="nm">${src.dataset.cn}</div>`;
    }else if(!hasCn&&slot.dataset.cn){
      const lc=slot.dataset.link.replace(/-champ$/,'');
      const idx=lc.replace(/^.*?(\d+)$/,'$1');
      const label=String.fromCharCode(65+parseInt(idx));
      slot.className='S';slot.style.cssText+=';border-color:#888;background:#0f1629';
      slot.dataset.cn='';slot.dataset.av='';
      slot.innerHTML=`<div class="ph" style="font-size:11px;color:var(--text3)">${label}组冠军</div>`;
    }
  });
}

async function loadH2C(){
  if(typeof html2canvas!=='undefined')return true;
  try{
    await new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
      s.onload=res;s.onerror=rej;document.head.appendChild(s)});
    return true;
  }catch(e){return false}
}

function genReport(){
  const lines=['═══ 明日方舟香草杯 战报 ═══',''];
  const allPanels=document.querySelectorAll('.panel');
  for(const t of tabs){
    const panel=document.getElementById('p-'+t.id);
    if(!panel)continue;
    const tabBtn=[...document.querySelectorAll('.tab-btn')];
    const idx=tabs.indexOf(t);
    const label=tabBtn[idx]?.textContent||t.id;
    const winners=panel.querySelectorAll('.S.W');
    if(!winners.length)continue;
    lines.push(`【${label}】`);
    // Collect by round
    const rounds={};
    winners.forEach(s=>{
      const r=parseInt(s.dataset.r)||0;
      if(r<1)return;
      if(!rounds[r])rounds[r]=[];
      const pa=document.getElementById(s.dataset.pa);
      const pb=document.getElementById(s.dataset.pb);
      const loserA=pa&&pa.dataset.cn&&pa.dataset.cn!==s.dataset.cn?pa.dataset.cn:null;
      const loserB=pb&&pb.dataset.cn&&pb.dataset.cn!==s.dataset.cn?pb.dataset.cn:null;
      const loser=loserA||loserB||'轮空';
      rounds[r].push({winner:s.dataset.cn,loser});
    });
    const maxR=Math.max(...Object.keys(rounds).map(Number));
    for(let r=1;r<=maxR;r++){
      if(!rounds[r])continue;
      let rName;
      if(r===maxR)rName='冠军';
      else if(r===maxR-1)rName='决赛';
      else if(r===maxR-2)rName='半决赛';
      else rName=`第${r+1}轮`;
      // For champion round, show differently
      if(r===maxR&&rounds[r].length===1){
        lines.push(`  🏆 ${rName}: ${rounds[r][0].winner}`);
      }else{
        lines.push(`  ${rName}:`);
        for(const m of rounds[r]){
          lines.push(`    ${m.winner} > ${m.loser}`);
        }
      }
    }
    lines.push('');
  }
  // Summary line
  const champs=[];
  for(const t of tabs){
    const panel=document.getElementById('p-'+t.id);
    if(!panel)continue;
    const champSlot=panel.querySelector('.S.champ.W');
    if(champSlot&&champSlot.dataset.cn){
      const idx=tabs.indexOf(t);
      const label=[...document.querySelectorAll('.tab-btn')][idx]?.textContent||t.id;
      champs.push(`${label}: ${champSlot.dataset.cn}`);
    }
  }
  if(champs.length){
    lines.push('══ 冠军一览 ══');
    champs.forEach(c=>lines.push('  🏆 '+c));
  }
  document.getElementById('report-text').value=lines.join('\n');
}

function copyReport(){
  const ta=document.getElementById('report-text');
  ta.select();
  document.execCommand('copy');
  alert('战报已复制！');
}

/* ── Character Picker ── */
function openCharPick(){
  const box=document.getElementById('charpick-box');
  // Build groups from enabled pools
  const groups=[];
  if(pools.operators&&RAW_OPS.length)groups.push({key:'ops',label:`干员 (${RAW_OPS.length})`,items:RAW_OPS});
  if(pools.enemies&&RAW_ENEMIES.length)groups.push({key:'enemies',label:`敌人 (${RAW_ENEMIES.length})`,items:RAW_ENEMIES});
  if(pools.story&&RAW_STORY.length)groups.push({key:'story',label:`剧情角色 (${RAW_STORY.length})`,items:RAW_STORY});
  if(pools.items&&RAW_ITEMS.length)groups.push({key:'items',label:`道具 (${RAW_ITEMS.length})`,items:RAW_ITEMS});
  if(!groups.length)groups.push({key:'ops',label:`干员 (${RAW_OPS.length})`,items:RAW_OPS});

  let all=[];
  for(const g of groups)all.push(...g.items);
  const seen=new Set();all=all.filter(o=>{if(seen.has(o.cn))return false;seen.add(o.cn);return true});
  const sel=selectedOnly?new Set(selectedOnly):new Set(all.map(o=>o.cn));
  window._cpAll=all;window._cpSel=sel;window._cpGroups=groups;

  let h=`<h2>🎯 选择参赛角色</h2>`;
  h+='<div class="cp-bar"><input type="text" id="cp-search" placeholder="搜索角色名…" oninput="filterCharPick()">';
  h+=`<button onclick="cpSelectAll()">全选</button><button onclick="cpDeselectAll()">全不选</button>`;
  h+=`<span id="cp-count">${sel.size}/${all.length} 已选</span></div>`;
  h+='<div class="cp-list" id="cp-list"></div>';
  h+='<div class="sbtns"><button onclick="closeCharPick()">取消</button><button onclick="cpReset()">重置(全部)</button><button class="primary" onclick="applyCharPick()">确定</button></div>';
  box.innerHTML=h;
  renderCharPickList(all,sel,'');
  document.getElementById('charpick-ov').classList.add('show');
}
function renderCharPickList(all,sel,q){
  const list=document.getElementById('cp-list');if(!list)return;
  const groups=window._cpGroups||[{key:'all',label:'全部',items:all}];
  let h='';
  for(const g of groups){
    const filtered=q?g.items.filter(o=>o.cn.includes(q)):g.items;
    if(!filtered.length)continue;
    const gSel=filtered.filter(o=>sel.has(o.cn)).length;
    h+=`<div style="width:100%;display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--border2)">`;
    h+=`<strong style="color:var(--accent);font-size:12px">${g.label}</strong>`;
    h+=`<span style="font-size:11px;color:var(--text3)">${gSel}/${filtered.length}</span>`;
    h+=`<button onclick="cpGroupSel('${g.key}',true)" style="font-size:10px;background:var(--border2);color:var(--text2);border:none;border-radius:3px;padding:1px 6px;cursor:pointer">全选</button>`;
    h+=`<button onclick="cpGroupSel('${g.key}',false)" style="font-size:10px;background:var(--border2);color:var(--text2);border:none;border-radius:3px;padding:1px 6px;cursor:pointer">全不选</button>`;
    h+=`</div>`;
    for(const o of filtered){
      const s=sel.has(o.cn)?'sel':'';
      const av=o.av?`<img src="${o.av}" loading="lazy">`:'';
      h+=`<div class="cp-item ${s}" onclick="cpToggle('${o.cn.replace(/'/g,"\\'")}',this)" title="${o.cn}">${av}<span class="ci-n">${o.cn}</span></div>`;
    }
  }
  list.innerHTML=h||'<div style="color:var(--text3);padding:20px">无匹配结果</div>';
}
function cpGroupSel(key,add){
  const g=window._cpGroups.find(g=>g.key===key);if(!g)return;
  const q=document.getElementById('cp-search')?.value||'';
  const filtered=q?g.items.filter(o=>o.cn.includes(q)):g.items;
  for(const o of filtered){if(add)window._cpSel.add(o.cn);else window._cpSel.delete(o.cn)}
  filterCharPick();
  const c=document.getElementById('cp-count');if(c)c.textContent=window._cpSel.size+'/'+window._cpAll.length+' 已选';
}
function filterCharPick(){
  const q=document.getElementById('cp-search')?.value||'';
  renderCharPickList(window._cpAll,window._cpSel,q);
}
function cpToggle(cn,el){
  const sel=window._cpSel;
  if(sel.has(cn)){sel.delete(cn);el.classList.remove('sel')}
  else{sel.add(cn);el.classList.add('sel')}
  const c=document.getElementById('cp-count');if(c)c.textContent=sel.size+'/'+window._cpAll.length+' 已选';
}
function cpSelectAll(){
  const q=document.getElementById('cp-search')?.value||'';
  const filtered=q?window._cpAll.filter(o=>o.cn.includes(q)):window._cpAll;
  for(const o of filtered)window._cpSel.add(o.cn);
  filterCharPick();
  const c=document.getElementById('cp-count');if(c)c.textContent=window._cpSel.size+'/'+window._cpAll.length+' 已选';
}
function cpDeselectAll(){
  const q=document.getElementById('cp-search')?.value||'';
  const filtered=q?window._cpAll.filter(o=>o.cn.includes(q)):window._cpAll;
  for(const o of filtered)window._cpSel.delete(o.cn);
  filterCharPick();
  const c=document.getElementById('cp-count');if(c)c.textContent=window._cpSel.size+'/'+window._cpAll.length+' 已选';
}
function cpReset(){selectedOnly=null;closeCharPick();rebuildData();buildAll()}
function applyCharPick(){
  const sel=window._cpSel;
  if(sel.size===window._cpAll.length)selectedOnly=null;
  else selectedOnly=new Set(sel);
  closeCharPick();rebuildData();buildAll();
}
function closeCharPick(){document.getElementById('charpick-ov').classList.remove('show')}

/* ── Swap Mode ── */
function toggleSwap(){
  swapMode=!swapMode;swapSlot=null;
  const btn=document.getElementById('swapBtn');
  if(btn)btn.style.background=swapMode?'#4a90d9':'';
  if(!swapMode)document.querySelectorAll('.swap-src').forEach(s=>s.classList.remove('swap-src'));
}
function handleSlotClick(s){
  if(!swapMode)return false;
  if(parseInt(s.dataset.r)!==0||s.classList.contains('bye'))return true;
  if(!swapSlot){
    swapSlot=s;s.classList.add('swap-src');
  }else{
    // Swap the two round-0 slots
    const a=swapSlot,b=s;
    const acn=a.dataset.cn,aav=a.dataset.av,aart=a.dataset.art;
    const bcn=b.dataset.cn,bav=b.dataset.av,bart=b.dataset.art;
    setR0Slot(a,bcn,bav,bart);
    setR0Slot(b,acn,aav,aart);
    a.classList.remove('swap-src');
    swapSlot=null;
  }
  return true;
}
function setR0Slot(s,cn,av,art){
  if(!cn){
    s.className='S bye';s.dataset.cn='';s.dataset.av='';delete s.dataset.art;
    s.innerHTML='<div class="nm">轮空</div>';s.removeAttribute('onclick');
  }else{
    const ac=art?'art':'';
    s.className='S F';s.dataset.cn=cn;s.dataset.av=av;
    if(art)s.dataset.art='1';else delete s.dataset.art;
    s.innerHTML=`<img class="${ac}" src="${av}" loading="lazy"><div class="nm">${cn}</div>`;
  }
}

/* ── Theme ── */
function getLineColor(){return getComputedStyle(document.documentElement).getPropertyValue('--line').trim()||'#2a4a7a'}
function getGoldColor(){return getComputedStyle(document.documentElement).getPropertyValue('--line-gold').trim()||'#f0c040'}
function toggleTheme(){
  const t=document.documentElement.dataset.theme==='light'?'':'light';
  document.documentElement.dataset.theme=t;
  localStorage.setItem('ak-theme',t);
  buildAll();
}
// Restore theme on load
(function(){const t=localStorage.getItem('ak-theme');if(t)document.documentElement.dataset.theme=t})();

/* ── Start ── */
init();
